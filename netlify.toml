[build]
  publish = "public"
  # Stämplar varje publicering med commit-id så att webbläsaren alltid hämtar den nya koden
  command = "sed -i \"s/__V__/${COMMIT_REF:-dev}/g\" public/index.html"

[functions]
  directory = "netlify/functions"

# Alla sidor (/sok, /bolag/VOLV-B.ST …) visas av index.html.
# API-funktionerna under /api/* har egna sökvägar och går före den här regeln.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

# Själva sidan sparas aldrig gammal, så att nya versioner syns direkt
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

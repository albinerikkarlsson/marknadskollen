[build]
  publish = "public"
  command = ""

[functions]
  directory = "netlify/functions"

# Alla sidor (/sok, /bolag/VOLV-B.ST …) visas av index.html.
# API-funktionerna under /api/* har egna sökvägar och går före den här regeln.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
